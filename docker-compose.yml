services:
  db:
    # pgvector image rather than plain postgres: the vector extension lands in a
    # follow-up PR and swapping the image later would force a volume rebuild.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial}
      POSTGRES_DB: ${POSTGRES_DB:-financial}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without this the api service races the database on first start.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financial} -d ${POSTGRES_DB:-financial}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      FR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-financial}:${POSTGRES_PASSWORD:-financial}@db:5432/${POSTGRES_DB:-financial}
      FR_OUTPUT_DIR: /app/data/raw
    ports:
      - "${API_PORT:-8010}:8010"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
