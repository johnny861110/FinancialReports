[project]
name = "financial-reports"
version = "3.0.0"
description = "Taiwan Financial Insight Engine - 財報分析引擎 & Agent Data Source"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.7.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pandas>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
pdf    = ["pdfplumber>=0.11.0", "pypdfium2>=4.0.0"]
ocr    = ["paddleocr>=2.7.0", "paddlepaddle>=2.6.0", "opencv-python>=4.9.0"]
vector = ["chromadb>=0.5.0", "sentence-transformers>=3.0.0"]
llm    = ["openai>=1.30.0", "tiktoken>=0.7.0"]
all    = [
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.0.0",
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
]

[project.scripts]
fr = "src.cli:app"

# ---------------------------------------------------------------------------
# Dependency groups — dev tools, not distributed with the package
# Install: uv sync --group dev
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

# ---------------------------------------------------------------------------
# Build backend — hatchling works best with uv
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src/storage/schema.sql" = "src/storage/schema.sql"

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
[tool.uv]
# Install dev group by default when running `uv sync`
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# Ruff — replaces flake8 + black + isort
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
